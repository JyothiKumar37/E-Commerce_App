# The storefront: a static bundle served by nginx.
#
# VITE_API_URL is inlined into the JavaScript at BUILD time, so the environment
# variable below changes nothing by itself. The image has to be built with it:
#
#   docker build -f apps/web/Dockerfile --target production \
#     --build-arg VITE_API_URL=https://jeds.shop/api \
#     -t ecom/web:local .
#
# It is kept here so `kubectl describe` records what the running bundle was
# built against, which is otherwise invisible.
#
# Two replicas, sized for a two-node EKS cluster. On a single node with 2 vCPU
# there is not room for that, so scale the tier down first:
#   kubectl -n ecom scale deploy --replicas=1 -l app.kubernetes.io/component=backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecom
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: storefront
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # Zero-downtime: the replacement must pass its readiness probe before the pod
  # it replaces is removed. Combined with two replicas and the PodDisruptionBudget
  # in poddisruptionbudgets.yaml, neither a rollout nor a node drain can take this
  # service to zero endpoints — and EKS drains nodes on every AMI upgrade.
  #
  # This needs room for one extra pod per deployment while a rollout runs. That is
  # affordable on two nodes; it was not on the single 2-vCPU node minikube ran on,
  # which is why this was maxSurge 0 before. See the header note.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: ecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: storefront
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Spread the replicas across nodes. Preferred rather than required: on a
      # single-node cluster a hard rule would leave the second replica Pending
      # for ever, and one node is a perfectly reasonable place to run this in
      # development.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: web
                    app.kubernetes.io/part-of: ecom
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # No runAsNonRoot here, and that is deliberate. This is nginx:1.27-alpine
      # listening on :80: ports below 1024 need CAP_NET_BIND_SERVICE, and the
      # master process writes /var/run/nginx.pid, which only root may do.
      # Pinning an unprivileged uid makes nginx die at startup with
      # "bind() to 0.0.0.0:80 failed (13: Permission denied)". nginx already
      # drops its worker processes to the unprivileged nginx user by itself.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: 034768441662.dkr.ecr.ap-south-1.amazonaws.com/ecom/web:sha-80b16b606ceb
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Drop everything, then hand back only what nginx genuinely uses:
              # NET_BIND_SERVICE for :80, and CHOWN/SETUID/SETGID so the master
              # can start workers as the nginx user.
              drop: [ALL]
              add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID]
          env:
            - name: VITE_API_URL
              value: https://jeds.shop/api
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Static files, so there is no dependency to distinguish liveness from
          # readiness. Both simply ask nginx for the index document.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
