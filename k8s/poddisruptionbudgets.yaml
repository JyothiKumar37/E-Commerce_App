# Disruption budgets for the replicated tier.
#
# These govern VOLUNTARY disruption — a node drain, a cluster autoscaler
# scale-in, an EKS AMI upgrade. Without one, `kubectl drain` evicts every pod on
# a node at once, and with two replicas that can mean both copies of a service
# going at the same time. The rollout settings in each Deployment do not help
# here: they only constrain the Deployment controller, not the eviction API.
#
# minAvailable 1, not maxUnavailable 0. A budget that permits no disruption at
# all blocks a drain for ever and turns a routine node upgrade into an
# operational incident.
#
# Deliberately absent for postgres, redis, elasticsearch and
# recommendation-generation. Each runs a single replica, so any budget over zero
# would make them permanently undrainable. Their availability comes from the
# volume surviving the pod, not from a second copy.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: ecom
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: ecom
---
