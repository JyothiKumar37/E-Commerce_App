apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: ecom
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      # Named, so the port only has to be correct in the Deployment.
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: ecom
