apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecom
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  # ClusterIP: reachable inside the namespace only. Nothing in this stack should
  # be published directly — the Ingress is the single way in.
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: ecom
