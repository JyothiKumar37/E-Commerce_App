apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ecom
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search-index
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  # ClusterIP: reachable inside the namespace only. Nothing in this stack should
  # be published directly — the Ingress is the single way in.
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: ecom
