apiVersion: v1
data:
  App.tsx: "import { Component, type ErrorInfo, type ReactNode } from \"react\";\nimport { Link, Route, Routes } from \"react-router-dom\";\nimport { Layout } from \"@/components/Layout\";\nimport { Button, EmptyState } from \"@/components/ui\";\nimport { HomePage } from \"@/pages/Home\";\nimport { SearchPage } from \"@/pages/Search\";\nimport { ProductPage } from \"@/pages/Product\";\nimport { CartPage } from \"@/pages/Cart\";\nimport { CheckoutPage } from \"@/pages/Checkout\";\nimport { OrderDetailPage, OrdersPage } from \"@/pages/Orders\";\nimport { SignInPage, SignUpPage } from \"@/pages/Auth\";\nimport { AccountLayout, AddressesPage, ProfilePage, SecurityPage } from \"@/pages/Account\";\n\n/**\n * Catches render-time exceptions so one broken component shows a recoverable\n * message instead of unmounting the whole app to a blank white page.\n */\ninterface BoundaryState {\n  error: Error | null;\n  componentStack: string | null;\n}\n\nclass ErrorBoundary extends Component<{ children: ReactNode }, BoundaryState> {\n  state: BoundaryState = { error: null, componentStack: null };\n\n  static getDerivedStateFromError(error: Error) {\n    return { error };\n  }\n\n  componentDidCatch(error: Error, info: ErrorInfo) {\n    // The component stack is the only part of this that names WHICH component\n    // threw. A minified JS stack points at bundle offsets and is useless\n    // without a source map; the component stack stays readable in production.\n    // Keeping it console-only cost two round trips diagnosing a live crash.\n    this.setState({ componentStack: info.componentStack ?? null });\n    // In production this is where a Sentry/OTel exporter would go.\n    console.error(\"Unhandled render error\", error, info.componentStack);\n  }\n\n  render() {\n    if (this.state.error) {\n      return (\n        <div className=\"mx-auto max-w-2xl px-4 py-16\">\n          <EmptyState\n            icon=\"⚠️\"\n            title=\"Something went wrong\"\n            description=\"An unexpected error occurred while rendering this page.\"\n            action={<Button onClick={() => window.location.reload()}>Reload the page</Button>}\n          />\n\n          {/*\n            Show the actual message. A bare \"something went wrong\" forces\n            whoever hits this to open devtools to learn anything at all, which\n            is a poor trade for hiding a client-side error the visitor's own\n            browser already has. Collapsed so it does not dominate the page.\n          */}\n          <details className=\"mt-6 rounded-lg border border-slate-200 bg-white p-4 text-sm dark:border-slate-800 dark:bg-slate-900\">\n            <summary className=\"cursor-pointer font-medium text-slate-700 dark:text-slate-300\">\n              Error details\n            </summary>\n            <p className=\"mt-3 font-mono text-xs text-red-700 dark:text-red-400\">\n              {this.state.error.name}: {this.state.error.message}\n            </p>\n            {this.state.componentStack && (\n              <>\n                <p className=\"mt-4 text-xs font-medium text-slate-700 dark:text-slate-300\">\n                  Component stack — the topmost entry is the component that threw\n                </p>\n                <pre className=\"mt-1 max-h-56 overflow-auto whitespace-pre-wrap text-xs text-slate-600 dark:text-slate-400\">\n                  {this.state.componentStack.trim()}\n                </pre>\n              </>\n            )}\n\n            {this.state.error.stack && (\n              <>\n                <p className=\"mt-4 text-xs font-medium text-slate-700 dark:text-slate-300\">\n                  JavaScript stack\n                </p>\n                <pre className=\"mt-1 max-h-56 overflow-auto whitespace-pre-wrap break-all text-xs text-slate-500 dark:text-slate-400\">\n                  {this.state.error.stack}\n                </pre>\n              </>\n            )}\n            <p className=\"mt-3 text-xs text-slate-500 dark:text-slate-400\">\n              A failed API call is the usual cause. Check the Network tab for a request to{\" \"}\n              <code>/api/…</code> that did not return JSON.\n            </p>\n          </details>\n        </div>\n      );\n    }\n    return this.props.children;\n  }\n}\n\nfunction NotFoundPage() {\n  return (\n    <EmptyState\n      icon=\"\U0001F9ED\"\n      title=\"Page not found\"\n      description=\"The page you were looking for does not exist or has moved.\"\n      action={\n        <Link to=\"/\">\n          <Button>Back to home</Button>\n        </Link>\n      }\n    />\n  );\n}\n\nexport function App() {\n  return (\n    <ErrorBoundary>\n      <Routes>\n        <Route element={<Layout />}>\n          <Route index element={<HomePage />} />\n          <Route path=\"search\" element={<SearchPage />} />\n          <Route path=\"products/:productId\" element={<ProductPage />} />\n          <Route path=\"cart\" element={<CartPage />} />\n          <Route path=\"checkout\" element={<CheckoutPage />} />\n          <Route path=\"orders\" element={<OrdersPage />} />\n          <Route path=\"orders/:orderId\" element={<OrderDetailPage />} />\n          <Route path=\"signin\" element={<SignInPage />} />\n          <Route path=\"signup\" element={<SignUpPage />} />\n\n          <Route path=\"account\" element={<AccountLayout />}>\n            <Route index element={<ProfilePage />} />\n            <Route path=\"addresses\" element={<AddressesPage />} />\n            <Route path=\"security\" element={<SecurityPage />} />\n          </Route>\n\n          <Route path=\"*\" element={<NotFoundPage />} />\n        </Route>\n      </Routes>\n    </ErrorBoundary>\n  );\n}\n"
  index.css: |
    @tailwind base;
    @tailwind components;
    @tailwind utilities;

    @layer base {
      :root {
        color-scheme: light dark;
      }

      /* Honour a user's reduced-motion preference across the whole app. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      html {
        scroll-behavior: smooth;
      }

      /* Consistent, visible focus ring for keyboard users. */
      :focus-visible {
        outline: 2px solid theme("colors.brand.500");
        outline-offset: 2px;
      }
    }

    @layer utilities {
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    }
  main.tsx: |
    import { StrictMode } from "react";
    import { createRoot } from "react-dom/client";
    import { BrowserRouter } from "react-router-dom";
    import { QueryClient, QueryClientProvider } from "@tanstack/react-query";
    import { App } from "./App";
    import { AuthProvider } from "./store/auth";
    import { ToastProvider } from "./store/toast";
    import { ApiError } from "./lib/api";
    import "./index.css";

    const queryClient = new QueryClient({
      defaultOptions: {
        queries: {
          staleTime: 30_000,
          gcTime: 5 * 60_000,
          refetchOnWindowFocus: false,
          retry: (failureCount, error) => {
            // 4xx responses are the client's fault; retrying only wastes quota.
            if (error instanceof ApiError && error.status < 500) return false;
            return failureCount < 2;
          },
        },
        mutations: { retry: false },
      },
    });

    const container = document.getElementById("root");
    if (!container) throw new Error("Root element #root is missing from index.html");

    createRoot(container).render(
      <StrictMode>
        <BrowserRouter>
          <QueryClientProvider client={queryClient}>
            {/* Toasts sit outside AuthProvider so auth errors can surface through them. */}
            <ToastProvider>
              <AuthProvider>
                <App />
              </AuthProvider>
            </ToastProvider>
          </QueryClientProvider>
        </BrowserRouter>
      </StrictMode>,
    );
