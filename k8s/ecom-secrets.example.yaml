# Template. Copy to ecom-secrets.yaml (gitignored) and fill in real values:
#
#   cp k8s/ecom-secrets.example.yaml k8s/ecom-secrets.yaml
#
# A Kubernetes Secret is base64, not encryption: anyone who can read the
# namespace can decode it. The real file is gitignored and generated per
# cluster. Beyond a development cluster, use Sealed Secrets, External Secrets or
# the cloud provider's own secret store, and give this Secret its own RBAC rule.
#
# JWT_SECRET and INTERNAL_JWT_SECRET must be different values, each at least 32
# characters. They are separated on purpose: JWT_SECRET signs the 15-minute
# tokens the browser holds, INTERNAL_JWT_SECRET the 60-second tokens the gateway
# mints for each hop between services. One shared key would let a stolen browser
# token be replayed straight at an internal service, past every check the
# gateway performs.
#
# The password inside DATABASE_URL must match POSTGRES_PASSWORD: Postgres is
# initialised from the second, and every service connects with the first.
#
# Generate each one separately:
#
#   openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: ecom-secrets
  namespace: ecom
  labels:
    app.kubernetes.io/name: ecom-secrets
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGE_ME_openssl_rand_base64_24"
  DATABASE_URL: "postgres://ecom:CHANGE_ME_openssl_rand_base64_24@postgres:5432/ecom"
  JWT_SECRET: "CHANGE_ME_openssl_rand_base64_48_aaaaaaaaaaaaaaaaaaaaaaaa"
  INTERNAL_JWT_SECRET: "CHANGE_ME_openssl_rand_base64_48_bbbbbbbbbbbbbbbbbbbbbbbb"
