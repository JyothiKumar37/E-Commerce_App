apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecom
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  # ClusterIP: reachable inside the namespace only. Nothing in this stack should
  # be published directly — the Ingress is the single way in.
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: ecom
