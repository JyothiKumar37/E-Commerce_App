# Checkout orchestration. Runs the saga — price the cart, hold stock, capture
# payment, consume stock, create the shipment — with a compensating action for
# every step. Money is only captured once stock is held, and stock is only
# consumed once money is captured, so neither can be lost without the other.
# It therefore talks to more services than anything else here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: place-order
  namespace: ecom
  labels:
    app.kubernetes.io/name: place-order
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # maxUnavailable 0 keeps a replica serving for the whole rollout; readiness
  # gating means the new pod only takes traffic once /readyz says its
  # dependencies are reachable.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: place-order
      app.kubernetes.io/part-of: ecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: place-order
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Nothing here calls the Kubernetes API, so mounting a token would only
      # hand an attacker a credential on a successful RCE.
      automountServiceAccountToken: false
      # The shared server drains in-flight requests and closes its pools on
      # SIGTERM. Thirty seconds is ample and stops a slow checkout being cut off.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Matches USER node in the image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: place-order
          image: ecom/place-order:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: ACCOUNT_SERVICE_URL
              value: http://account:8081
            - name: ALLOW_INSECURE_DB_CONNECTION
              value: "true"
            - name: CART_SERVICE_URL
              value: http://cart:8082
            - name: CORS_ORIGINS
              value: http://13.233.175.73
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: INTERNAL_JWT_SECRET
            - name: INVENTORY_SERVICE_URL
              value: http://inventory:8083
            - name: LOG_LEVEL
              value: info
            - name: NODE_ENV
              value: production
            - name: PAYMENT_SERVICE_URL
              value: http://payment:8085
            - name: PGSSLMODE
              value: disable
            - name: PORT
              value: "8086"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: SERVICE_NAME
              value: place-order
            - name: SHIPPING_SERVICE_URL
              value: http://shipping:8091
            - name: TAX_RATE
              value: "0.19"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Readiness and liveness are deliberately different endpoints.
          # /readyz checks Postgres and Redis, so a failing dependency removes
          # this pod from the Service; /healthz only asks whether the process is
          # alive. Restarting a pod because its database blinked would turn a
          # brief outage into a crash loop across every service at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # readOnlyRootFilesystem above leaves nowhere to write; Node wants a
            # scratch directory even though this code does not use one.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
