# The single entry point for API traffic and the only service the Ingress
# forwards to. It authenticates the caller against JWT_SECRET, then mints a
# short-lived token signed with INTERNAL_JWT_SECRET for each hop onwards, so a
# stolen browser token cannot be replayed directly against a backend.
#
# Its routes are mounted at the root — /catalog/search, not /api/catalog/search
# — which is why the API Ingress rewrites the prefix away before forwarding.
# COOKIE_PATH must describe what the BROWSER sees (/api/auth), not what this
# service serves; a mismatch silently ends every session at the access-token TTL.
#
# Two replicas, sized for a two-node EKS cluster. On a single node with 2 vCPU
# there is not room for that, so scale the tier down first:
#   kubectl -n ecom scale deploy --replicas=1 -l app.kubernetes.io/component=backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # Zero-downtime: the replacement must pass its readiness probe before the pod
  # it replaces is removed. Combined with two replicas and the PodDisruptionBudget
  # in poddisruptionbudgets.yaml, neither a rollout nor a node drain can take this
  # service to zero endpoints — and EKS drains nodes on every AMI upgrade.
  #
  # This needs room for one extra pod per deployment while a rollout runs. That is
  # affordable on two nodes; it was not on the single 2-vCPU node minikube ran on,
  # which is why this was maxSurge 0 before. See the header note.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: ecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Nothing here calls the Kubernetes API, so mounting a token would only
      # hand an attacker a credential on a successful RCE.
      # Spread the replicas across nodes. Preferred rather than required: on a
      # single-node cluster a hard rule would leave the second replica Pending
      # for ever, and one node is a perfectly reasonable place to run this in
      # development.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api-gateway
                    app.kubernetes.io/part-of: ecom
      automountServiceAccountToken: false
      # The shared server drains in-flight requests and closes its pools on
      # SIGTERM. Thirty seconds is ample and stops a slow checkout being cut off.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Matches USER node in the image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: 034768441662.dkr.ecr.ap-south-1.amazonaws.com/ecom/api-gateway:sha-4b405d1dd59b
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_OPTIONS
              value: "--import @ecom/shared/telemetry"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring:4318"
            - name: ACCESS_TOKEN_TTL
              value: 15m
            - name: ACCOUNT_SERVICE_URL
              value: http://account:8081
            - name: ALLOW_INSECURE_DB_CONNECTION
              value: "true"
            - name: CART_SERVICE_URL
              value: http://cart:8082
            - name: COOKIE_PATH
              value: "/api/auth"
            - name: COOKIE_SAMESITE
              value: lax
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: ecom-config
                  key: COOKIE_SECURE
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: ecom-config
                  key: PUBLIC_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: INTERNAL_JWT_SECRET
            - name: INVENTORY_SERVICE_URL
              value: http://inventory:8083
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              value: info
            - name: NODE_ENV
              value: production
            - name: ORDER_STATUS_SERVICE_URL
              value: http://order-status:8084
            - name: PAYMENT_SERVICE_URL
              value: http://payment:8085
            - name: PGSSLMODE
              value: no-verify
            - name: PLACE_ORDER_SERVICE_URL
              value: http://place-order:8086
            - name: PORT
              value: "8080"
            - name: PRODUCT_REVIEW_SERVICE_URL
              value: http://product-review:8087
            - name: RECOMMENDATION_GENERATION_SERVICE_URL
              value: http://recommendation-generation:8089
            - name: RECOMMENDATION_SERVICE_URL
              value: http://recommendation:8088
            - name: REDIS_URL
              value: redis://redis:6379
            - name: REFRESH_TOKEN_TTL_DAYS
              value: "30"
            - name: SEARCH_SERVICE_URL
              value: http://search:8090
            - name: SERVICE_NAME
              value: api-gateway
            - name: SHIPPING_SERVICE_URL
              value: http://shipping:8091
          resources:
            requests:
              # Requests size the *scheduler's* reservation, not a cap — limits
              # below are what throttle. These services idle near 10m, so the
              # earlier 100m was a guess that reserved ten times what they use
              # and left the node unable to fit its own workload.
              cpu: 80m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # A startup probe comes first, so the liveness probe does not run at all
          # until the process has answered once. Thirteen Node services booting
          # together on two shared cores start slowly, and without this the
          # liveness probe kills pods that are merely queued for CPU — which
          # looks exactly like a crash loop and is not one.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Readiness and liveness are deliberately different endpoints.
          # /readyz checks Postgres and Redis, so a failing dependency removes
          # this pod from its Service; /healthz only asks whether the process is
          # alive. Restarting a pod because its database blinked would turn a
          # brief outage into a crash loop across every service at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            # 5s, not 3s: /readyz makes a Postgres and a Redis round trip, and
            # under CPU contention that overran the old timeout. That is what
            # pulled `search` out of its Service on the two-core node with the
            # process perfectly healthy.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # readOnlyRootFilesystem above leaves nowhere to write; Node wants a
            # scratch directory even though this code does not use one.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
