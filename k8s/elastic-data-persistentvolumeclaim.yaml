# Search index storage.
#
# Elasticsearch derives its disk watermarks from the volume size and flips every
# index to read-only at the 95% flood stage, so this needs headroom rather than a
# tight fit. The 100Mi default a converter would pick is enough to make search
# silently stop updating.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elastic-data
  namespace: ecom
  labels:
    app.kubernetes.io/name: elastic-data
    app.kubernetes.io/component: search-index
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  # ReadWriteOnce: one node mounts this at a time, which is why the workload
  # using it deploys with the Recreate strategy rather than RollingUpdate.
  accessModes:
    - ReadWriteOnce
  # `standard` is the default class on minikube, kind and most managed clusters.
  # Name the cluster's own class here if it differs.
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
