# Shopping carts. Reads product details back from the search service so a cart
# line can show a name and price without a second round trip to the catalogue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: ecom
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # maxUnavailable 0 keeps a replica serving for the whole rollout; readiness
  # gating means the new pod only takes traffic once /readyz says its
  # dependencies are reachable.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/part-of: ecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Nothing here calls the Kubernetes API, so mounting a token would only
      # hand an attacker a credential on a successful RCE.
      automountServiceAccountToken: false
      # The shared server drains in-flight requests and closes its pools on
      # SIGTERM. Thirty seconds is ample and stops a slow checkout being cut off.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Matches USER node in the image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart
          image: ecom/cart:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: ALLOW_INSECURE_DB_CONNECTION
              value: "true"
            - name: CORS_ORIGINS
              value: http://13.233.175.73
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: INTERNAL_JWT_SECRET
            - name: LOG_LEVEL
              value: info
            - name: NODE_ENV
              value: production
            - name: PGSSLMODE
              value: disable
            - name: PORT
              value: "8082"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: SEARCH_SERVICE_URL
              value: http://search:8090
            - name: SERVICE_NAME
              value: cart
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Readiness and liveness are deliberately different endpoints.
          # /readyz checks Postgres and Redis, so a failing dependency removes
          # this pod from the Service; /healthz only asks whether the process is
          # alive. Restarting a pod because its database blinked would turn a
          # brief outage into a crash loop across every service at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            # readOnlyRootFilesystem above leaves nowhere to write; Node wants a
            # scratch directory even though this code does not use one.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
