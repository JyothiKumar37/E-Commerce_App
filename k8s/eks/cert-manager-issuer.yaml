# Let's Encrypt, via cert-manager, using the HTTP-01 challenge.
#
# Apply AFTER cert-manager itself is installed and its webhook is ready:
#
#   helm repo add jetstack https://charts.jetstack.io && helm repo update
#   helm install cert-manager jetstack/cert-manager \
#     --namespace cert-manager --create-namespace \
#     --set crds.enabled=true
#   kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=300s
#   kubectl apply -f k8s/eks/cert-manager-issuer.yaml
#
# Applying it before the webhook is Ready fails with "no endpoints available for
# service cert-manager-webhook" — wait, then apply again.
#
# HTTP-01 rather than DNS-01, deliberately. HTTP-01 needs only that the hostname
# already resolves to this cluster's load balancer on port 80, which it does by
# the time you get here. DNS-01 would need an IAM role and Route 53 credentials
# in the cluster, and buys nothing unless you want a wildcard certificate.
#
# The certificate is renewed automatically at two thirds of its 90-day life. If
# renewal ever fails the site keeps serving the old certificate until it
# actually expires, so there is a month of slack to notice.
#
# ClusterIssuer, not Issuer: an Issuer is namespaced and would have to be
# duplicated for anything outside `ecom`.
---
# Staging first. Let's Encrypt rate-limits production certificates to five
# duplicates per week, and a misconfigured HTTP-01 challenge burns through that
# quickly — at which point you wait days rather than minutes. Staging has far
# looser limits and issues an untrusted certificate, which is enough to prove
# the challenge works before switching the annotation to `letsencrypt`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: letsencrypt-staging
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/managed-by: kubectl
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Expiry warnings are sent here. Replace it: a real address is the only
    # notice you get that automatic renewal has stopped working.
    email: CHANGE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels:
    app.kubernetes.io/name: letsencrypt
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/managed-by: kubectl
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
