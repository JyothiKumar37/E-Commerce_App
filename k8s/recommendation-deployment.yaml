# Serves precomputed recommendations. Read-only and fast: the expensive work
# happens in recommendation-generation, on a schedule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: ecom
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # maxSurge 0, and that is a deliberate downgrade from zero-downtime.
  #
  # With one replica, surging means scheduling a second copy of the pod before
  # releasing the first. On a node with no spare CPU there is nowhere to put it:
  # the new pod sits Pending, the old one is never released, and `rollout
  # status` times out with "1 old replicas are pending termination" while
  # nothing is actually wrong with the image.
  #
  # Replacing in place needs no headroom. It costs a few seconds of
  # unavailability per service, which a single-replica deployment cannot honestly
  # avoid anyway. Raise replicas above 1 and this can go back to maxSurge 1.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation
      app.kubernetes.io/part-of: ecom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      # Nothing here calls the Kubernetes API, so mounting a token would only
      # hand an attacker a credential on a successful RCE.
      automountServiceAccountToken: false
      # The shared server drains in-flight requests and closes its pools on
      # SIGTERM. Thirty seconds is ample and stops a slow checkout being cut off.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # Matches USER node in the image.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recommendation
          image: ecom/recommendation:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          env:
            - name: ALLOW_INSECURE_DB_CONNECTION
              value: "true"
            - name: CORS_ORIGINS
              value: http://13.233.175.73
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: INTERNAL_JWT_SECRET
            - name: LOG_LEVEL
              value: info
            - name: NODE_ENV
              value: production
            - name: PGSSLMODE
              value: disable
            - name: PORT
              value: "8088"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: SERVICE_NAME
              value: recommendation
          resources:
            requests:
              # Requests size the *scheduler's* reservation, not a cap — limits
              # below are what throttle. These services idle near 10m, so the
              # earlier 100m was a guess that reserved ten times what they use
              # and left the node unable to fit its own workload.
              cpu: 30m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # A startup probe comes first, so the liveness probe does not run at all
          # until the process has answered once. Thirteen Node services booting
          # together on two shared cores start slowly, and without this the
          # liveness probe kills pods that are merely queued for CPU — which
          # looks exactly like a crash loop and is not one.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # Readiness and liveness are deliberately different endpoints.
          # /readyz checks Postgres and Redis, so a failing dependency removes
          # this pod from its Service; /healthz only asks whether the process is
          # alive. Restarting a pod because its database blinked would turn a
          # brief outage into a crash loop across every service at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            # 5s, not 3s: /readyz makes a Postgres and a Redis round trip, and
            # under CPU contention that overran the old timeout. That is what
            # pulled `search` out of its Service on the two-core node with the
            # process perfectly healthy.
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # readOnlyRootFilesystem above leaves nowhere to write; Node wants a
            # scratch directory even though this code does not use one.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
