# Demo catalogue. Safe to apply alongside the migration Job: the initContainer
# below waits for the products table rather than for Postgres.
#
#   kubectl apply -f k8s/seed-job.yaml
#   kubectl -n ecom wait --for=condition=complete job/ecom-seed --timeout=300s
#
# This is demo data. Do not apply it to a cluster holding real orders.
apiVersion: batch/v1
kind: Job
metadata:
  name: ecom-seed
  namespace: ecom
  labels:
    app.kubernetes.io/name: ecom-seed
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 6
  # Reap the finished Job after an hour, so the next deploy is not blocked by a
  # leftover object. Needs the TTLAfterFinished controller, on by default since
  # 1.23; older clusters simply ignore it.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecom-seed
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: ecom
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Waits on the migration's effect, not on Postgres. Seeding an
        # un-migrated database fails on a missing relation, which would burn
        # backoffLimit and leave the storefront empty.
        - name: wait-for-schema
          image: postgres:16.3-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -c
            - |
              until psql "$DATABASE_URL" -c 'SELECT 1 FROM products LIMIT 1' >/dev/null 2>&1; do
                echo "waiting for migrations..."
                sleep 3
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: seed
          image: 034768441662.dkr.ecr.ap-south-1.amazonaws.com/ecom/database:sha-6392a3ad1384
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["node", "packages/database/seed.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: DATABASE_URL
            - name: PGSSLMODE
              value: disable
            # Postgres is reachable only inside the namespace, so the production
            # TLS requirement is waived deliberately rather than by omission.
            - name: ALLOW_INSECURE_DB_CONNECTION
              value: "true"
            # seed.js refuses to load demo data under NODE_ENV=production unless
            # this is set. Every service here runs as production, so the Job
            # would exit 1 without it.
            - name: ALLOW_SEED
              value: "yes"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
