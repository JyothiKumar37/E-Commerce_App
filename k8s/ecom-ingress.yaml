# Two Ingress objects, not one.
#
# The gateway mounts its routes at the root: it serves /catalog/search, not
# /api/catalog/search. Something has to strip the prefix, and nginx-ingress does
# not do it for a plain `path: /api` — the request reaches the gateway still
# carrying /api and every API call 404s.
#
# The stripping is done by rewrite-target, which applies to EVERY path in the
# Ingress it is declared on. Putting the storefront rule in the same object
# would rewrite `/` to an empty capture group and break the site, so the two
# rules live in separate objects. nginx-ingress merges them into one server.
#
# Why not send /api to the storefront pod and let its own nginx.conf strip the
# prefix, the way Compose does? That config resolves the gateway through
# `resolver 127.0.0.11`, Docker's embedded DNS. It does not exist in Kubernetes,
# so every proxied call would 502. Routing /api here bypasses that block.
#
# Both rules land on the same origin, which is what keeps the API same-origin:
# no CORS preflights, and the refresh cookie stays first-party. The gateway's
# COOKIE_PATH=/api/auth describes what the browser sees here, not the /auth it
# serves internally.
#
# There is no `tls:` block here, and that is correct for this cluster.
#
# TLS terminates at the Network Load Balancer, using a certificate from AWS
# Certificate Manager attached by an annotation on the ingress-nginx controller
# Service. An ACM certificate has no exportable private key — it can only be
# attached to an AWS load balancer, never mounted into a pod — so there is
# nothing for a Kubernetes TLS secret to hold. nginx therefore receives plain
# HTTP from the NLB and must not try to serve HTTPS itself.
#
# Two consequences follow, both easy to get wrong:
#
#   - The controller needs `ssl-redirect: "false"`. nginx sees every request as
#     HTTP, so the usual redirect would send an HTTPS visitor to HTTPS for ever.
#     The redirect is done instead by a separate listener the NLB's port 80 maps
#     to.
#   - Adding a `tls:` block below would make nginx present its own self-signed
#     certificate on a connection the NLB has already decrypted.
#
# When adding a hostname, `host:` on both rules must match PUBLIC_ORIGIN in
# ecom-config exactly. An Ingress that matches a host the services do not allow
# gives a site that renders pages and 403s every POST.
#
# With no host at all, the rule matches any Host header — which is what a bare
# IP or a load balancer hostname needs.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-api-ingress
  namespace: ecom
  labels:
    app.kubernetes.io/name: ecom-api
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # $2 is the second capture group of the path below: everything after /api.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Checkout waits on the payment provider, so do not cut it short.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    #
    # No configuration-snippet here. It previously carried
    #   add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    # and ingress-nginx rejects it outright:
    #   admission webhook "validate.nginx.ingress.kubernetes.io" denied the
    #   request: nginx.ingress.kubernetes.io/configuration-snippet annotation
    #   cannot be used. Snippet directives are disabled by the Ingress
    #   administrator
    # Snippets splice arbitrary text into the controller's nginx.conf, so recent
    # releases disable them by default. Turning them back on cluster-wide to win
    # one response header is a bad trade.
    #
    # The gateway now sets that header itself, in createApp(). That is the right
    # place regardless: the service knows its responses are uncacheable, and the
    # header then holds however it is fronted — Ingress, compose, or direct.
spec:
  ingressClassName: nginx
  rules:
    - host: jeds.shop
      http:
        paths:
          # (/|$)(.*) so /api, /api/ and /api/catalog/search all work:
          #   /api/catalog/search -> $2 = catalog/search -> /catalog/search
          #   /api                -> $2 = ""             -> /
          # pathType must be ImplementationSpecific: ingress-nginx v1.9+ rejects
          # regex characters in a Prefix path.
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-web-ingress
  namespace: ecom
  labels:
    app.kubernetes.io/name: ecom-web
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: ecom
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: jeds.shop
      http:
        paths:
          # Everything else is the storefront. nginx evaluates the regex
          # location above ahead of this prefix match, so /api never lands here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
