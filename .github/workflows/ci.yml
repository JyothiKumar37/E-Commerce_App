# Continuous integration.
#
# Runs on every pull request and on pushes to main. Four independent jobs give
# fast, parallel feedback:
#
#   quality      formatting, lint, typecheck and the structural verify.mjs guard
#   unit         the node:test suites across every workspace
#   smoke        constructs every service app offline (scripts/smoke.mjs)
#   integration  the real customer journey and the oversell race, against a
#                full Docker Compose stack (scripts/e2e.mjs, scripts/oversell.mjs)
#
# The heavy integration job is deliberately separate so a formatting slip fails
# in seconds rather than after a full stack boot.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref. A new push cancels the previous run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. No job here writes to the repo or needs a cloud identity.
permissions:
  contents: read

env:
  # Matches .nvmrc and the node:20.19 base image every service is built on.
  NODE_VERSION: "20.19.0"

jobs:
  quality:
    name: Lint, format, types, structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Structural verify
        run: npm run verify

      - name: Dependency audit (advisory)
        # Advisory only: a freshly disclosed CVE in a transitive dependency
        # should surface here without blocking an unrelated change from merging.
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace test suites
        run: npm test

  smoke:
    name: Service construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Construct every service app offline
        run: node scripts/smoke.mjs

  integration:
    name: End-to-end and oversell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate a throwaway .env
        # openssl and python3 are both present on the runner. The secrets live
        # only for the life of this job and are never uploaded.
        run: bash scripts/generate-secrets.sh

      - name: Start the datastores
        # Elasticsearch and the database must be up and SEEDED before the search
        # service boots. Its one-shot ensureIndex() builds the analyzer mapping
        # and fills the index from Postgres at startup; if it boots against an
        # empty or unmigrated database that step fails, and the outbox indexer
        # then lets Elasticsearch auto-create a dynamic mapping with no
        # case-insensitive normalizers. Basic search still works, but the
        # brand/category/cross-field assertions fail.
        run: docker compose up -d postgres redis elasticsearch

      - name: Wait for Postgres and Elasticsearch
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U ecom -d ecom >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            echo "waiting for postgres (attempt ${attempt})"; sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null 2>&1; then
              echo "elasticsearch ready"; break
            fi
            echo "waiting for elasticsearch (attempt ${attempt})"; sleep 5
          done

      - name: Migrate and seed
        # Runs before the search service starts, so search indexes a populated
        # catalogue on boot instead of an empty one.
        run: |
          docker compose run --rm migrate
          docker compose run --rm seed

      - name: Build and start the application services
        # Search now boots with Elasticsearch healthy and the catalogue seeded,
        # so ensureIndex() creates the correct mapping and fills all 12 products.
        run: docker compose up --build -d

      - name: Wait for Elasticsearch-backed search
        # Ready only when search serves via Elasticsearch (degraded=false) with
        # the full seeded catalogue indexed -- not the Postgres fallback, and not
        # a half-populated index.
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl -s -X POST http://127.0.0.1:8080/catalog/search \
              -H 'content-type: application/json' \
              -d '{"q":"","pageSize":50}' || true)
            ready=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{const d=JSON.parse(s);process.stdout.write(d.degraded===false&&(d.items?.length??0)>=12?'yes':'no')}catch{process.stdout.write('no')}})")
            if [ "$ready" = "yes" ]; then
              echo "elasticsearch-backed search ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "waiting for elasticsearch-backed search (attempt ${attempt})"
            sleep 5
          done
          echo "search did not reach a healthy Elasticsearch-backed state in time" >&2
          docker compose ps
          docker compose logs --no-color --tail=120 search elasticsearch
          exit 1

      - name: End-to-end customer journey
        run: node scripts/e2e.mjs
        env:
          API_URL: http://127.0.0.1:8080

      - name: Oversell race test
        run: node scripts/oversell.mjs
        env:
          API_URL: http://127.0.0.1:8080

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
