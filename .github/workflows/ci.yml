# Continuous integration.
#
# Runs on every pull request and on pushes to main. Four independent jobs give
# fast, parallel feedback:
#
#   quality      formatting, lint, typecheck and the structural verify.mjs guard
#   unit         the node:test suites across every workspace
#   smoke        constructs every service app offline (scripts/smoke.mjs)
#   integration  the real customer journey and the oversell race, against a
#                full Docker Compose stack (scripts/e2e.mjs, scripts/oversell.mjs)
#
# The heavy integration job is deliberately separate so a formatting slip fails
# in seconds rather than after a full stack boot.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref. A new push cancels the previous run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. No job here writes to the repo or needs a cloud identity.
permissions:
  contents: read

env:
  # Matches .nvmrc and the node:20.19 base image every service is built on.
  NODE_VERSION: "20.19.0"

jobs:
  quality:
    name: Lint, format, types, structure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Structural verify
        run: npm run verify

      - name: Dependency audit (advisory)
        # Advisory only: a freshly disclosed CVE in a transitive dependency
        # should surface here without blocking an unrelated change from merging.
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run workspace test suites
        run: npm test

  smoke:
    name: Service construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Construct every service app offline
        run: node scripts/smoke.mjs

  integration:
    name: End-to-end and oversell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate a throwaway .env
        # openssl and python3 are both present on the runner. The secrets live
        # only for the life of this job and are never uploaded.
        run: bash scripts/generate-secrets.sh

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Migrate and seed
        # Both wait on Postgres becoming healthy through compose depends_on, so
        # they can be run immediately after the stack comes up.
        run: |
          docker compose run --rm migrate
          docker compose run --rm seed

      - name: Wait for the gateway to serve traffic
        # Poll a real gateway -> search -> datastore path rather than a bare
        # liveness probe, so the journey does not start before the stack is
        # actually ready.
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:8080/catalog/search \
              -H 'content-type: application/json' \
              -d '{"q":"","pageSize":1}' || true)
            if [ "$code" = "200" ]; then
              echo "stack ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "waiting for stack (attempt ${attempt}): HTTP ${code}"
            sleep 5
          done
          echo "stack did not become ready in time" >&2
          docker compose ps
          exit 1

      - name: End-to-end customer journey
        run: node scripts/e2e.mjs
        env:
          API_URL: http://127.0.0.1:8080

      - name: Oversell race test
        run: node scripts/oversell.mjs
        env:
          API_URL: http://127.0.0.1:8080

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
