# ArgoCD Application: otel-collector
# Multi-source: the upstream Helm chart plus this repo's values file ($values).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: "0.170.0"
      helm:
        valueFiles:
          - $values/monitoring/values/otel-collector.yaml
    - repoURL: https://github.com/JyothiKumar37/E-Commerce_App.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
