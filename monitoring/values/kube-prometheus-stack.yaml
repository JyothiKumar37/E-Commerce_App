# kube-prometheus-stack values. Chart version pinned to 88.5.4 in the Application.
prometheus:
  # Scrape the ecom application services' /metrics (the RED metrics from the
  # shared library). Selects the 11 backends + the api-gateway; excludes the
  # nginx web frontend, which exposes no /metrics endpoint. Prometheus has
  # cluster-wide RBAC, so a ServiceMonitor here scrapes across into the ecom ns.
  additionalServiceMonitors:
    - name: ecom-services
      namespaceSelector:
        matchNames: [ecom]
      selector:
        matchLabels:
          app.kubernetes.io/part-of: ecom
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values: [backend, gateway]
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
  prometheusSpec:
    retention: 30d
    # Discover ServiceMonitors/PodMonitors/Rules from ALL namespaces (the ecom
    # services live in the ecom namespace, not this release's).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard # matches k8s/eks/storageclass.yaml (no default class exists)
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
grafana:
  # TODO Phase 6: replace admin password with an existing Secret and enable SSO.
  defaultDashboardsEnabled: true
  # Loki + Tempo datasources with log<->trace correlation.
  # NOTE verify the Tempo service port against the tempo chart (3200 vs 3100)
  # and the derivedFields $$ escaping against your kube-prometheus-stack version.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
# alertmanager Slack routing is wired in Phase 4 (alerts) - left at chart default here.

# Phase 4: alerting. Re-enabled now the third node provides capacity.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # The Slack webhook is mounted from a Secret so it never lands in Git.
    # Create it once BEFORE syncing (placeholder is fine to start):
    #   kubectl -n monitoring create secret generic alertmanager-slack \
    #     --from-literal=webhook='https://hooks.slack.com/services/XXX/YYY/ZZZ'
    secrets:
      - alertmanager-slack
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
  config:
    route:
      receiver: slack
      group_by: [alertname, namespace, job]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: slack
          repeat_interval: 1h
    receivers:
      - name: slack
        slack_configs:
          - channel: "#alerts"
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook
            send_resolved: true

# Alert rules grounded in the metrics now flowing (RED histogram + kube-state).
# kube-prometheus-stack sets `job` to the service name by default; if a rule
# stays silent, verify the label with a Prometheus query and adjust.
additionalPrometheusRulesMap:
  ecom-alerts:
    groups:
      - name: ecom-slo
        rules:
          - alert: EcomHighErrorRate
            expr: 'sum by (job) (rate(http_request_duration_seconds_count{namespace="ecom",status=~"5.."}[5m])) / sum by (job) (rate(http_request_duration_seconds_count{namespace="ecom"}[5m])) > 0.05'
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.job }} 5xx error rate above 5% (SLO burn)"
          - alert: EcomHighLatencyP99
            expr: 'histogram_quantile(0.99, sum by (job, le) (rate(http_request_duration_seconds_bucket{namespace="ecom"}[5m]))) > 0.5'
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.job }} p99 latency above 500ms"
      - name: ecom-app
        rules:
          - alert: EcomServiceDown
            expr: 'up{namespace="ecom"} == 0'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.job }} has no healthy scrape targets"
          - alert: EcomCheckoutSagaErrors
            expr: 'sum(rate(http_request_duration_seconds_count{namespace="ecom",job="place-order",status=~"5.."}[5m])) > 0.1'
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "place-order (checkout saga) 5xx rate elevated"
          - alert: EcomPodCrashLooping
            expr: 'max by (namespace, pod) (kube_pod_container_status_waiting_reason{namespace="ecom",reason="CrashLoopBackOff"}) > 0'
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.pod }} is CrashLoopBackOff"
      - name: ecom-infra
        rules:
          - alert: EcomVolumeFillingUp
            expr: 'kubelet_volume_stats_available_bytes{namespace="ecom"} / kubelet_volume_stats_capacity_bytes{namespace="ecom"} < 0.15'
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} under 15% free"
