# Grafana Alloy DaemonSet: tail pod stdout (pino JSON) and push to Loki.
# CONFIRM the river config against the Alloy 1.11 component reference before sync.
controller:
  type: daemonset
alloy:
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pino.receiver]
      }

      // Lift the pino JSON fields we query on into structured metadata.
      loki.process "pino" {
        stage.json {
          expressions = { level = "level", requestId = "requestId", trace_id = "trace_id" }
        }
        stage.labels {
          values = { level = "level" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
