server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API ----------------------------------------------------------
    # Same-origin proxy to the gateway. Keeping the API on this origin means no
    # CORS preflights and a first-party refresh cookie; the alternative of
    # exposing the gateway on its own port makes every call cross-origin.
    #
    # COOKIE_PATH must be /api/auth to match what the browser sees: the gateway
    # sets the cookie's path and has no idea it sits behind this prefix.
    location /api/ {
        # Docker's embedded DNS, re-resolved every 10s. Without this nginx
        # resolves api-gateway once at startup and keeps a stale IP after the
        # gateway is recreated on deploy, returning 502 until nginx restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway api-gateway;

        # Strip the prefix: the gateway mounts its routes at the root.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # API responses must never be browser-cached. GET endpoints are
        # cacheable by default, and a single bad response cached early — for
        # example index.html returned with a 200 while a dev server was still
        # in front — is then replayed on every subsequent load, long after the
        # proxy is fixed. That is invisible to curl and survives a soft reload.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;

        # Checkout can wait on a payment provider.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # --- Static assets -------------------------------------------------
    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document must never be cached, or users get a stale bundle
    # referencing assets that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: client-side routes are not real files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The API is same-origin, so 'self' covers it. No host needs naming here.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
